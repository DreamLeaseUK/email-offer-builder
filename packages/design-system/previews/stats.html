<!-- @dsCard group="Components" -->
<title>Stat tiles</title>
<link rel="stylesheet" href="../styles/dreamlease.css">
<div class="dl-root" style="padding:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px">
  <div class="dl-stat">
    <span class="dl-stat__label">Leads this month</span>
    <span class="dl-stat__value">312</span>
    <span class="dl-stat__delta dl-stat__delta--up">▲ +12% vs last month</span>
  </div>
  <div class="dl-stat">
    <span class="dl-stat__label">Conversion rate</span>
    <span class="dl-stat__value">2.49%</span>
    <span class="dl-stat__delta dl-stat__delta--down">▼ −0.3pt vs last month</span>
  </div>
  <div class="dl-stat">
    <span class="dl-stat__label">Live offers</span>
    <span class="dl-stat__value">49</span>
  </div>
</div>
