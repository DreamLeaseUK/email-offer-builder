<!-- @dsCard group="Components" -->
<title>Buttons</title>
<link rel="stylesheet" href="../styles/dreamlease.css">
<div class="dl-root" style="padding:32px;display:flex;flex-direction:column;gap:24px">
  <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
    <button class="dl-btn dl-btn--primary">Get a quote</button>
    <button class="dl-btn dl-btn--secondary">View all offers</button>
    <button class="dl-btn dl-btn--outline">Compare</button>
    <button class="dl-btn dl-btn--ghost">Learn more</button>
    <button class="dl-btn dl-btn--primary" disabled>Unavailable</button>
  </div>
  <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
    <button class="dl-btn dl-btn--primary dl-btn--sm">Small</button>
    <button class="dl-btn dl-btn--primary">Medium</button>
    <button class="dl-btn dl-btn--primary dl-btn--lg">Large</button>
  </div>
  <div class="dl-surface-dark" style="padding:20px 24px;border-radius:16px;display:flex;gap:14px;align-items:center">
    <button class="dl-btn dl-btn--primary">Enquire now</button>
    <button class="dl-btn dl-btn--reversed">Browse deals</button>
  </div>
</div>
