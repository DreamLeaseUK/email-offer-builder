<title>Alerts</title>
<link rel="stylesheet" href="../styles/dreamlease.css">
<div class="dl-root" style="padding:32px;display:flex;flex-direction:column;gap:14px;max-width:560px">
  <div class="dl-alert dl-alert--info"><div><span class="dl-alert__title">Delivery update</span>Factory-order vehicles are currently arriving in 8–12 weeks.</div></div>
  <div class="dl-alert dl-alert--warning"><div><span class="dl-alert__title">Offer ending soon</span>This price is only guaranteed until the end of the month.</div></div>
  <div class="dl-alert dl-alert--error"><div><span class="dl-alert__title">Something went wrong</span>We couldn't submit your enquiry. Please try again.</div></div>
  <div class="dl-alert dl-alert--neutral"><div><span class="dl-alert__title">Business leasing</span>Prices shown exclude VAT for business contract hire.</div></div>
</div>
